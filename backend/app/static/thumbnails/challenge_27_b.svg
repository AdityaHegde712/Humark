<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="bg_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a0000" />
      <stop offset="100%" stop-color="#0a0a0c" />
    </linearGradient>
    <linearGradient id="accent_grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d50000" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.3" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1280" height="720" fill="url(#bg_grad)" />

  <!-- Ambient Glow Shape -->
  <circle cx="950" cy="360" r="320" fill="#d50000" opacity="0.18" filter="url(#glow)" />
  <circle cx="200" cy="600" r="250" fill="#d50000" opacity="0.12" filter="url(#glow)" />

  <!-- Geometric Grid Pattern Lines -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1.5">
    <line x1="0" y1="180" x2="1280" y2="180" />
    <line x1="0" y1="360" x2="1280" y2="360" />
    <line x1="0" y1="540" x2="1280" y2="540" />
    <line x1="320" y1="0" x2="320" y2="720" />
    <line x1="640" y1="0" x2="640" y2="720" />
    <line x1="960" y1="0" x2="960" y2="720" />
  </g>

  <!-- Hairline Card Container -->
  <rect x="50" y="50" width="1180" height="620" rx="24" fill="#121214" fill-opacity="0.75" stroke="#26262b" stroke-width="2" />

  <!-- Variant Pill Badge (Top Left) -->
  <rect x="90" y="90" width="140" height="52" rx="26" fill="#d50000" fill-opacity="0.2" stroke="#d50000" stroke-width="2" />
  <text x="160" y="125" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="900" fill="#d50000" text-anchor="middle" letter-spacing="2">VARIANT B</text>

  <!-- Topic Tag Pill (Top Right) -->
  <rect x="1000" y="90" width="190" height="46" rx="23" fill="#202026" stroke="#33333d" stroke-width="1.5" />
  <text x="1095" y="120" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#a0a0b0" text-anchor="middle" letter-spacing="1.5">NO DAMAGE</text>

  <!-- Visual Center Piece / Graphic Element -->
  <g transform="translate(640, 310)">
    <!-- Concentric accent arcs -->
    <circle cx="0" cy="0" r="140" fill="none" stroke="#d50000" stroke-width="4" stroke-dasharray="16 12" opacity="0.6" />
    <circle cx="0" cy="0" r="100" fill="#18181f" stroke="#d50000" stroke-width="3" />
    <circle cx="0" cy="0" r="45" fill="#d50000" opacity="0.85" />
    <text x="0" y="15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" fill="#000000" text-anchor="middle">B</text>
  </g>

  <!-- Hero Typography Header -->
  <text x="640" y="520" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="54" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="-1">
    FINAL BOSS DEFEATED
  </text>

  <!-- Subtitle Hook -->
  <text x="640" y="580" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#9e9ea8" text-anchor="middle" letter-spacing="0.5">
    Level 1 No Damage Run
  </text>

  <!-- Bottom Accent Bar -->
  <rect x="50" y="660" width="1180" height="10" rx="5" fill="#d50000" opacity="0.8" />
</svg>