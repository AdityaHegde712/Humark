services:
  db:
    image: postgres:16-alpine
    container_name: humark-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: humark
      POSTGRES_PASSWORD: humark_password
      POSTGRES_DB: humark
    ports:
      - "5433:5432"  # Maps host 5433 -> container 5432
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U humark -d humark"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: humark-backend
    restart: unless-stopped
    command: sh -c "python -m app.scripts.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8001:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://humark:humark_password@db:5432/humark
      SYNC_DATABASE_URL: postgresql://humark:humark_password@db:5432/humark
      BACKEND_PORT: 8000
      FRONTEND_PORT: 5173
      MOCK_MODEL_SEED: 42
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173,http://localhost:8001,http://127.0.0.1:8001
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      ENVIRONMENT: development
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: humark-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8001
      VITE_BACKEND_TARGET: http://backend:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  pgdata:
    driver: local
